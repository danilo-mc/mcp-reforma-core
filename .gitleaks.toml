# Extends the default gitleaks rules. Azure built-in role/policy definition IDs are public
# GUIDs (documented by Microsoft) and trip the generic-api-key rule in Bicep maps.
[extend]
useDefault = true

[[allowlists]]
description = "Azure built-in role and policy definition GUIDs in Bicep"
condition = "AND"
paths = ['''(^|/)infra/.*\.bicep$''']
regexTarget = "line"
regexes = ['''^\s*[A-Za-z0-9_]+:\s*'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'\s*$''']
